name: Manual IDE UI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelists-settings:
    name: Run Changelists settings UI test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run IDE UI test
        run: xvfb-run -a ./gradlew test --tests com.example.jetbrains.integration.ChangelistsSettingsTest --rerun-tasks --no-daemon

      - name: Upload test and Starter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-ui-test-artifacts
          if-no-files-found: ignore
          path: |
            build/reports/tests/test/
            build/test-results/test/
            out/
            captures/
            allure-results/
            hs_err_pid*
            replay_pid*
            *.hprof
            *.jfr
